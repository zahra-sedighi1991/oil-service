services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oil_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - oil_service_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oil_service"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oil_service_postgres:
