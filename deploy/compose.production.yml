name: oil-service

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    image: oil-service-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3001
      NODE_OPTIONS: --max-old-space-size=256
      NUXT_PUBLIC_API_BASE: https://${DOMAIN}/api/v1
      NUXT_PUBLIC_PUBLIC_API_BASE: https://${DOMAIN}
    expose:
      - "3001"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: oil-service-api:${APP_VERSION:-latest}
    restart: unless-stopped
    command:
      - sh
      - -c
      - node node_modules/typeorm/cli.js -d dist/database/data-source.js migration:run && exec node dist/main.js
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=384
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER in .env.production}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.production}
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      CORS_ORIGINS: https://${DOMAIN}
      SWAGGER_ENABLED: "false"
      OTP_ENABLED: ${OTP_ENABLED:-false}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-System Admin}
      PUBLIC_BASE_URL: https://${DOMAIN}
      ANDROID_UPDATE_DIR: /app/updates/android
      PRODUCT_IMAGE_DIR: /app/uploads/products
    volumes:
      - ./android-updates:/app/updates/android:ro
      - product_images:/app/uploads/products
    expose:
      - "3000"
    networks:
      - proxy
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.production}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  proxy:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  product_images:
